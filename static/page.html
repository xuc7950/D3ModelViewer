    <!--FBX查看器-->
    <script type='module'>
        // const fileSrc = '<?php echo $fileUrl; ?>';
        // const filename = '<?php echo $fileName ?>';
        // const filePath = fileSrc.replace(filename, "");
        // const suffix = filename.split(".")[filename.split(".").length-1];
        
        const fileSrc = fileURL;
        const filename = fileName;
        const filePath = fileSrc.replace(filename, "");
        const suffix = fileSuffix;
        const backgroundImg = "images/Background.jpg";
        sessionStorage['format'] = suffix;

        // 导入通用模块
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        // 声明格式与模块映射配置表
        const formatModulesMap = {
            fbx: [
                'three/addons/libs/stats.module.js',
                'three/addons/loaders/FBXLoader.js'
            ],
            obj: [
                'three/addons/loaders/MTLLoader.js',
                'three/addons/loaders/OBJLoader.js'
            ],
            stl: [
                'three/addons/libs/stats.module.js',
                'three/addons/loaders/STLLoader.js'
            ],
            gltf: [
                'three/addons/loaders/GLTFLoader.js',
                'three/addons/loaders/RGBELoader.js'
            ],
            glb: [
                'three/addons/loaders/GLTFLoader.js',
                'three/addons/loaders/RGBELoader.js'
            ],
            '3ds': [
                'three/addons/controls/TrackballControls.js',
                'three/addons/loaders/TDSLoader.js'
            ],
            bvh: [
                'three/addons/loaders/BVHLoader.js'
            ],
            ply: [
                'three/addons/libs/stats.module.js',
                'three/addons/loaders/PLYLoader.js'
            ],
            usdz: [
                'three/addons/loaders/RGBELoader.js',
                'three/addons/loaders/USDZLoader.js'
            ],
            usda: [
                'three/addons/loaders/RGBELoader.js',
                'three/addons/loaders/USDZLoader.js'
            ],
            usd: [
                'three/addons/loaders/RGBELoader.js',
                'three/addons/loaders/USDZLoader.js'
            ],
            '3dm': [
                'three/addons/loaders/3DMLoader.js',
                'three/addons/libs/lil-gui.module.min.js'
            ]
        };

        // 模块缓存，避免重复加载
        const loadedModulesCache = new Map();

        /**
         * 动态加载指定格式所需的模块
         * @param {string} format 文件格式 (fbx, obj, gltf, etc.)
         * @returns {Promise<Object>} 包含所有加载模块的对象
         */
        async function loadFormatModules(format) {
            format = format.toLowerCase();
            const modulePaths = formatModulesMap[format];
            
            if (!modulePaths) {
                throw new Error(`未找到格式 "${format}" 的模块配置`);
            }

            // 检查是否已经缓存
            if (loadedModulesCache.has(format)) {
                return loadedModulesCache.get(format);
            }

            try {
                // 并行加载所有模块
                const modulePromises = modulePaths.map(path => import(path));
                const modules = await Promise.all(modulePromises);

                // 提取模块的导出内容
                const result = {};
                modules.forEach((module, index) => {
                    const moduleName = modulePaths[index].split('/').pop().replace('.js', '');
                    result[moduleName] = module;
                });

                // 缓存结果
                loadedModulesCache.set(format, result);
                
                // console.log(`✅ 成功加载 ${format} 格式的模块:`, Object.keys(result));
                return result;

            } catch (error) {
                console.error(`❌ 加载 ${format} 模块失败:`, error);
                throw error;
            }
        }

        
        async function loadModules() {
            try {
                // 根据需要加载特定格式的模块
                const loadedModules = await loadFormatModules(fileSuffix);
                // console.log('已加载模块:', loadedModules);

                // 开始查看模型
                switch (suffix.toLowerCase()){
                    case "fbx":  viewFbx();
                        break;
                    case "obj":  viewObj();
                        break;
                    case "stl":  viewStl();
                        break;
                    case "gltf":  viewGltf();
                        break;
                    case "glb":  viewGlb();
                        break;
                    case "3ds":  view3ds();
                        break;
                    case "bvh":  viewBvh();
                        break;
                    case "ply":  viewPly();
                        break;
                    case "usdz":  viewUsdz();
                        break;
                    case "usda":  viewUsda();
                        break;
                    case "usd":  viewUsd();
                        break;
                    case "3dm":  view3dm();
                        break;
                    default:
                        break;
                }
            } catch (error) {
                console.error('模块加载过程中出错:', error);
            }
        }

        // 加载所有必要模块
        loadModules();
        // 模型加载进度
        const onProgress = function ( xhr ) {
            if ( xhr.lengthComputable ) {
                document.getElementById("loader1").style.display = "block";
                const percentComplete = xhr.loaded / xhr.total * 100;
                document.getElementById("loader1").style.width = percentComplete.toFixed( 2 ) + '%';
                document.getElementById("loader1").innerText = percentComplete.toFixed( 2 ) + '%';
                // console.log( percentComplete.toFixed( 2 ) + '% downloaded' );
                if (percentComplete.toFixed( 0 ) >= 100){
                    document.getElementById("loader1").style.display = "none";
                }
            }
        };
        
        const onProgress2 = function ( xhr ) {
            if ( xhr.lengthComputable ) {
                document.getElementById("loader2").style.display = "block";
                const percentComplete = xhr.loaded / xhr.total * 100;
                document.getElementById("loader2").style.width = percentComplete.toFixed( 2 ) + '%';
                document.getElementById("loader2").innerText = percentComplete.toFixed( 2 ) + '%';
                console.log( percentComplete.toFixed( 2 ) + '% downloaded' );
                if (percentComplete.toFixed( 0 ) >= 100){
                    document.getElementById("loader2").style.display = "none";
                }
            }
        };
        function viewFbx(){
            let camera, scene, renderer, stats;
            const clock = new THREE.Clock();
            const FBXLoader = loadedModulesCache.get('fbx')['FBXLoader'].FBXLoader;
            const Stats = loadedModulesCache.get('fbx')['stats.module'].default;
            let mixer;
            init();
            animate();

            function init() {
                const container = document.createElement( 'div' );
                document.body.appendChild( container );

                camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 10000 );
                camera.position.set( 100, 200, 300 );

                scene = new THREE.Scene();
                // scene.background = new THREE.Color( 0xa0a0a0 );
                // scene.fog = new THREE.Fog( 0xa0a0a0, 500, 1000 );
                const cubeMap = new THREE.CubeTextureLoader().load([backgroundImg,backgroundImg,backgroundImg,backgroundImg,backgroundImg,backgroundImg]);
                scene.background = cubeMap;

                const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x444444, 5 );
                hemiLight.position.set( 0, 200, 0 );
                scene.add( hemiLight );

                const dirLight = new THREE.DirectionalLight( 0xffffff, 5 );
                dirLight.position.set( 0, 200, 100 );
                dirLight.castShadow = true;
                dirLight.shadow.camera.top = 180;
                dirLight.shadow.camera.bottom = - 100;
                dirLight.shadow.camera.left = - 120;
                dirLight.shadow.camera.right = 120;
                scene.add( dirLight );

                // scene.add( new THREE.CameraHelper( dirLight.shadow.camera ) );

                // ground
                const mesh = new THREE.Mesh( new THREE.PlaneGeometry( 2000, 2000 ), new THREE.MeshPhongMaterial( { color: 0x999999, depthWrite: false } ) );
                mesh.rotation.x = - Math.PI / 2;
                mesh.receiveShadow = true;
                scene.add( mesh );

                const grid = new THREE.GridHelper( 2000, 20, 0x000000, 0x000000 );
                grid.material.opacity = 0.2;
                grid.material.transparent = true;
                scene.add( grid );

                // model
                const loader = new FBXLoader();
                loader.load( fileSrc , function ( object ) {
                    if(object.animations.length > 0){
                        mixer = new THREE.AnimationMixer( object );
                        const action = mixer.clipAction( object.animations[ 0 ] );
                        action.play();
                    }
                    object.traverse( function ( child ) {

                        if ( child.isMesh ) {

                            child.castShadow = true;
                            child.receiveShadow = true;

                        }

                    } );

                    scene.add( object );
                    viewControls(camera, object);

                }, onProgress );

                renderer = new THREE.WebGLRenderer( { antialias: true } );
                renderer.setPixelRatio( window.devicePixelRatio );
                renderer.setSize( window.innerWidth, window.innerHeight );
                renderer.shadowMap.enabled = true;
                container.appendChild( renderer.domElement );

                const controls = new OrbitControls( camera, renderer.domElement );
                controls.target.set( 0, 100, 0 );
                controls.update();

                window.addEventListener( 'resize', onWindowResize );

                // stats
                stats = new Stats();
                container.appendChild( stats.dom );
                
                
            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize( window.innerWidth, window.innerHeight );
            }

            function animate() {
                requestAnimationFrame( animate );
                const delta = clock.getDelta();
                if ( mixer ) mixer.update( delta );
                renderer.render( scene, camera );
                stats.update();
            }
        }

        function viewStl(){
            let container, stats;
            let camera, cameraTarget, scene, renderer;
            const STLLoader = loadedModulesCache.get('stl')['STLLoader'].STLLoader;
            const Stats = loadedModulesCache.get('stl')['stats.module'].default;
            init();
            animate();

            function init() {

                container = document.createElement( 'div' );
                document.body.appendChild( container );

                camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 1, 15 );
                camera.position.set( 3, 0.15, 3 );

                cameraTarget = new THREE.Vector3( 0, - 0.25, 0 );

                scene = new THREE.Scene();
    // 			scene.background = new THREE.Color( 0x72645b );
    // 			scene.fog = new THREE.Fog( 0x72645b, 2, 15 );
                const cubeMap = new THREE.CubeTextureLoader().load([backgroundImg,backgroundImg,backgroundImg,backgroundImg,backgroundImg,backgroundImg]);
                scene.background = cubeMap;

                // Ground

                const plane = new THREE.Mesh(
                    new THREE.PlaneGeometry( 40, 40 ),
                    new THREE.MeshPhongMaterial( { color: 0xcbcbcb, specular: 0x474747 } )
                );
                plane.rotation.x = - Math.PI / 2;
                plane.position.y = - 0.5;
                scene.add( plane );

                plane.receiveShadow = true;


                // ASCII file

                const loader = new STLLoader();
                loader.load( fileSrc, function ( geometry ) {

                    const material = new THREE.MeshPhongMaterial( { color: 0xff9c7c, specular: 0x494949, shininess: 200 } );
                    const mesh = new THREE.Mesh( geometry, material );

                    mesh.position.set( 0, - 0.25, 0.6 );
                    mesh.rotation.set( 0, - Math.PI / 2, 0 );
                    mesh.scale.set( 0.5, 0.5, 0.5 );

                    mesh.castShadow = true;
                    mesh.receiveShadow = true;

                    scene.add( mesh );
                    viewControls(camera, mesh);

                }, onProgress );


                // Binary files

                const material = new THREE.MeshPhongMaterial( { color: 0xd5d5d5, specular: 0x494949, shininess: 200 } );

                loader.load( fileSrc, function ( geometry ) {

                    const mesh = new THREE.Mesh( geometry, material );

                    mesh.position.set( 0.136, - 0.37, - 0.6 );
                    mesh.rotation.set( - Math.PI / 2, 0.3, 0 );
                    mesh.scale.set( 2, 2, 2 );

                    mesh.castShadow = true;
                    mesh.receiveShadow = true;

                    scene.add( mesh );
                    viewControls(camera, mesh);

                }, onProgress );

                // Colored binary STL
                loader.load( fileSrc, function ( geometry ) {

                    let meshMaterial = material;

                    if ( geometry.hasColors ) {

                        meshMaterial = new THREE.MeshPhongMaterial( { opacity: geometry.alpha, vertexColors: true } );

                    }

                    const mesh = new THREE.Mesh( geometry, meshMaterial );

                    mesh.position.set( 0.5, 0.2, 0 );
                    mesh.rotation.set( - Math.PI / 2, Math.PI / 2, 0 );
                    mesh.scale.set( 0.3, 0.3, 0.3 );

                    mesh.castShadow = true;
                    mesh.receiveShadow = true;

                    scene.add( mesh );
                    viewControls(camera, mesh);

                }, onProgress );


                // Lights

                scene.add( new THREE.HemisphereLight( 0x8d7c7c, 0x494966, 3 ) );

                addShadowedLight( 1, 1, 1, 0xffffff, 3.5 );
                addShadowedLight( 0.5, 1, - 1, 0xffd500, 3 );
                // renderer

                renderer = new THREE.WebGLRenderer( { antialias: true } );
                renderer.setPixelRatio( window.devicePixelRatio );
                renderer.setSize( window.innerWidth, window.innerHeight );

                renderer.shadowMap.enabled = true;

                container.appendChild( renderer.domElement );

                // stats

                stats = new Stats();
                container.appendChild( stats.dom );

                //

                window.addEventListener( 'resize', onWindowResize );
                const controls = new OrbitControls( camera, renderer.domElement );
                controls.target.set( 0, 100, 0 );
                controls.update();


            }

            function addShadowedLight( x, y, z, color, intensity ) {

                const directionalLight = new THREE.DirectionalLight( color, intensity );
                directionalLight.position.set( x, y, z );
                scene.add( directionalLight );

                directionalLight.castShadow = true;

                const d = 1;
                directionalLight.shadow.camera.left = - d;
                directionalLight.shadow.camera.right = d;
                directionalLight.shadow.camera.top = d;
                directionalLight.shadow.camera.bottom = - d;

                directionalLight.shadow.camera.near = 1;
                directionalLight.shadow.camera.far = 4;

                directionalLight.shadow.bias = - 0.002;

            }

            function onWindowResize() {

                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();

                renderer.setSize( window.innerWidth, window.innerHeight );

            }

            function animate() {

                requestAnimationFrame( animate );

                render();
                stats.update();

            }

            function render() {

                const timer = Date.now() * 0.0005;

                camera.position.x = Math.cos( timer ) * 3;
                camera.position.z = Math.sin( timer ) * 3;

                camera.lookAt( cameraTarget );

                renderer.render( scene, camera );

            }
        }
        function viewGlb(){
            viewGltf("glb");
        }

                    // 		await renderer.compileAsync( model, camera, scene );

                    // 		scene.add( model );

                    // 	} );

        function view3ds(){
            let container, controls;

            init();
            animate();

                        }

                    } );

            }

        function viewBvh(){
            const clock = new THREE.Clock();
            let camera, controls, scene, renderer;
            let mixer;
            const BVHLoader = loadedModulesCache.get('bvh')['BVHLoader'].BVHLoader;

            init();
            animate();

            const loader = new BVHLoader();
            loader.load( fileSrc, function ( result ) {

                const skeletonHelper = new THREE.SkeletonHelper( result.skeleton.bones[ 0 ] );

                scene.add( result.skeleton.bones[ 0 ] );
                viewControls(camera, result.skeleton.bones[ 0 ]);
                scene.add( skeletonHelper );

                // play animation

            }, onProgress );

            function init() {
                camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 1, 1000 );
                camera.position.set( 0, 200, 300 );

                scene = new THREE.Scene();
                // scene.background = new THREE.Color( 0xeeeeee );

                scene.background = cubeMap;

                scene.add( new THREE.GridHelper( 400, 10 ) );

                // renderer
                renderer = new THREE.WebGLRenderer( { antialias: true } );
                renderer.setPixelRatio( window.devicePixelRatio );
                renderer.setSize( window.innerWidth, window.innerHeight );
                document.body.appendChild( renderer.domElement );

                controls = new OrbitControls( camera, renderer.domElement );
                controls.minDistance = 300;
                controls.maxDistance = 700;

                window.addEventListener( 'resize', onWindowResize );

            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize( window.innerWidth, window.innerHeight );

            }

            function animate() {
                requestAnimationFrame( animate );
                const delta = clock.getDelta();
                if ( mixer ) mixer.update( delta );
                renderer.render( scene, camera );
            }
        }
        function viewPly(){
            let container, stats;
            let camera, cameraTarget, scene, renderer;
            const PLYLoader = loadedModulesCache.get('ply')['PLYLoader'].PLYLoader;
            const Stats = loadedModulesCache.get('fbx')['stats.module'].default;

            init();
            animate();

            function init() {
                container = document.createElement( 'div' );
                document.body.appendChild( container );
                camera = new THREE.PerspectiveCamera( 35, window.innerWidth / window.innerHeight, 1, 15 );
                camera.position.set( 3, 0.15, 3 );

                cameraTarget = new THREE.Vector3( 0, - 0.1, 0 );

                scene = new THREE.Scene();
                // scene.background = new THREE.Color( 0x72645b );
                // scene.fog = new THREE.Fog( 0x72645b, 2, 15 );
                const cubeMap = new THREE.CubeTextureLoader().load([backgroundImg,backgroundImg,backgroundImg,backgroundImg,backgroundImg,backgroundImg]);
                scene.background = cubeMap;

                // Ground
                const plane = new THREE.Mesh(
                    new THREE.PlaneGeometry( 40, 40 ),
                    new THREE.MeshPhongMaterial( { color: 0xcbcbcb, specular: 0x474747 } )
                );
                plane.rotation.x = - Math.PI / 2;
                plane.position.y = - 0.5;
                scene.add( plane );

                plane.receiveShadow = true;


                // PLY file
                const loader = new PLYLoader();
                loader.load( fileSrc, function ( geometry ) {

                    geometry.computeVertexNormals();

                    const material = new THREE.MeshStandardMaterial( { color: 0x009cff, flatShading: true } );
                    const mesh = new THREE.Mesh( geometry, material );

                    mesh.position.y = - 0.2;
                    mesh.position.z = 0.3;
                    mesh.rotation.x = - Math.PI / 2;
                    mesh.scale.multiplyScalar( 0.001 );

                    mesh.castShadow = true;
                    mesh.receiveShadow = true;

                    scene.add( mesh );
                    viewControls(camera, mesh );

                }, onProgress );

                loader.load( fileSrc, function ( geometry ) {

                    geometry.computeVertexNormals();

                    const material = new THREE.MeshStandardMaterial( { color: 0x009cff, flatShading: true } );
                    const mesh = new THREE.Mesh( geometry, material );

                    mesh.position.x = - 0.2;
                    mesh.position.y = - 0.02;
                    mesh.position.z = - 0.2;
                    mesh.scale.multiplyScalar( 0.0006 );

                    mesh.castShadow = true;
                    mesh.receiveShadow = true;

                    scene.add( mesh );
                    viewControls(camera, mesh );

                }, onProgress2 );

                // Lights
                scene.add( new THREE.HemisphereLight( 0x8d7c7c, 0x494966, 3 ) );

                addShadowedLight( 1, 1, 1, 0xffffff, 3.5 );
                addShadowedLight( 0.5, 1, - 1, 0xffd500, 3 );

                // renderer
                renderer = new THREE.WebGLRenderer( { antialias: true } );
                renderer.setPixelRatio( window.devicePixelRatio );
                renderer.setSize( window.innerWidth, window.innerHeight );

                renderer.shadowMap.enabled = true;

                container.appendChild( renderer.domElement );

                // stats
                stats = new Stats();
                container.appendChild( stats.dom );

                // resize
                window.addEventListener( 'resize', onWindowResize );
                const controls = new OrbitControls( camera, renderer.domElement );
                controls.target.set( 0, 100, 0 );
                controls.update();

            }

            function addShadowedLight( x, y, z, color, intensity ) {
                const directionalLight = new THREE.DirectionalLight( color, intensity );
                directionalLight.position.set( x, y, z );
                scene.add( directionalLight );

                directionalLight.castShadow = true;

                const d = 1;
                directionalLight.shadow.camera.left = - d;
                directionalLight.shadow.camera.right = d;
                directionalLight.shadow.camera.top = d;
                directionalLight.shadow.camera.bottom = - d;

                directionalLight.shadow.camera.near = 1;
                directionalLight.shadow.camera.far = 4;

                directionalLight.shadow.mapSize.width = 1024;
                directionalLight.shadow.mapSize.height = 1024;

                directionalLight.shadow.bias = - 0.001;

            }

            function onWindowResize() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize( window.innerWidth, window.innerHeight );
            }

            function animate() {
                requestAnimationFrame( animate );
                render();
                stats.update();
            }

            function render() {
                const timer = Date.now() * 0.0005;
                camera.position.x = Math.sin( timer ) * 2.5;
                camera.position.z = Math.cos( timer ) * 2.5;
                camera.lookAt( cameraTarget );
                renderer.render( scene, camera );
            }
        }

        function view3dm(){
            let camera, scene, renderer;
            let controls, gui;
            const Rhino3dmLoader = loadedModulesCache.get('3dm')['Rhino3dmLoader'].Rhino3dmLoader;
            const GUI = loadedModulesCache.get('3dm')['GUI'].GUI;

            init();
            animate();

            function init() {

                THREE.Object3D.DEFAULT_UP.set( 0, 0, 1 );

                renderer = new THREE.WebGLRenderer( { antialias: true } );
                renderer.setPixelRatio( window.devicePixelRatio );
                renderer.setSize( window.innerWidth, window.innerHeight );
                document.body.appendChild( renderer.domElement );

                camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 1, 1000 );
                camera.position.set( 26, - 40, 5 );

                scene = new THREE.Scene();
    // 			scene.background = new THREE.Color(0x555555);
                const cubeMap = new THREE.CubeTextureLoader().load([backgroundImg,backgroundImg,backgroundImg,backgroundImg,backgroundImg,backgroundImg]);
                scene.background = cubeMap;

                const directionalLight = new THREE.DirectionalLight( 0xffffff, 6 );
                directionalLight.position.set( 0, 0, 2 );
                scene.add( directionalLight );
                
                // lighting
                const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x444444, 3 );
                hemiLight.position.set( 0, 200, 0 );
                scene.add( hemiLight );

                const loader = new Rhino3dmLoader();
                //generally, use this for the Library Path: https://cdn.jsdelivr.net/npm/rhino3dm@8.0.0-beta2/
                loader.setLibraryPath( 'plugins/D3ModelViewer/static/ThreeJS/jsm/loaders/' );
                loader.load( fileSrc , function ( object ) {

                    scene.add( object );
                    viewControls(camera, object );
                    initGUI( object.userData.layers );

                    // hide spinner
                    document.getElementById( 'loader' ).style.display = 'none';

                }, onProgress );

                controls = new OrbitControls( camera, renderer.domElement );

                window.addEventListener( 'resize', resize );

            }

            function resize() {

                const width = window.innerWidth;
                const height = window.innerHeight;

                camera.aspect = width / height;
                camera.updateProjectionMatrix();

                renderer.setSize( width, height );

            }

            function animate() {

                controls.update();
                renderer.render( scene, camera );

                requestAnimationFrame( animate );

            }

            function initGUI( layers ) {

                gui = new GUI( { title: 'layers' } );

                for ( let i = 0; i < layers.length; i ++ ) {

                    const layer = layers[ i ];
                    gui.add( layer, 'visible' ).name( layer.name ).onChange( function ( val ) {

                        const name = this.object.name;

                        scene.traverse( function ( child ) {

                            if ( child.userData.hasOwnProperty( 'attributes' ) ) {

                                if ( 'layerIndex' in child.userData.attributes ) {

                                    const layerName = layers[ child.userData.attributes.layerIndex ].name;

                                    if ( layerName === name ) {

                                        child.visible = val;
                                        layer.visible = val;

                                    }

                                }

                            }

                        } );

                    } );

                }

            }
        }
        
        function viewControls(camera, model){
            window.addEventListener('keypress', (e)=>{
            // console.log(e.keyCode);
            var moveSpeed = 30;
            var scale = 0.03;
            switch (e.keyCode){
                case 119:
                    camera.translateZ(-moveSpeed);
                    //  console.log("向前");
                    break;
                case 115:
                    camera.translateZ(moveSpeed);
                    //  console.log("向后");
                    break;
                case 97:
                    camera.translateX(-moveSpeed);
                    //  console.log("向左");
                    break;
                case 100:
                    camera.translateX(moveSpeed);
                    //  console.log("向右");
                    break;
                case 113:
                    camera.translateY(-moveSpeed);
                    //  console.log("向下");
                    break;
                case 101:
                    camera.translateY(moveSpeed);
                    //  console.log("向上");
                    break;
                case 91:
                    model.scale.x -= scale;
                    model.scale.y -= scale;
                    model.scale.z -= scale;
                    break;
                case 93:
                    model.scale.x += scale;
                    model.scale.y += scale;
                    model.scale.z += scale;
                    break;
                default: break;
            }
            });
        }
